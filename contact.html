<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile | Portfolio</title>
  <meta name="description" content="Personal portfolio: About, Highlights, Skills, and Contact." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <head>
    <style>
      :root {
        --bg: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --line: #e5e7eb;
        --panel: #f9fafb;
        --panel-2: #f3f4f6;
        --accent: #2563eb;
        --radius: 14px;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        --max: 1100px;

        /* Anchor offset for sticky navbar (JS will update) */
        --navH: 64px;
      }

      .container {
        width: min(var(--max), calc(100% - 32px));
        margin: 0 auto;
      }

      /* Navbar */
      .nav {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }

      .nav-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 0;
        gap: 14px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        letter-spacing: 0.2px;
      }

      .brand-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--accent);
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .nav-links a {
        padding: 8px 10px;
        border-radius: 999px;
        color: var(--muted);
        font-weight: 700;
        font-size: 14px;
        border: 1px solid transparent;
      }

      .nav-links a:hover {
        background: var(--panel);
        color: var(--text);
      }

      .section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .section-title {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0.1px;
      }

      .card {
        border-radius: var(--radius);
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 14px;
      }

      .card-title {
        margin: 0 0 6px;
        font-size: 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        letter-spacing: 0.2px;
      }

      .brand-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--accent);
      }

      /* Contact links */
      .socials {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .social {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #ffffff;
        font-weight: 800;

      }

      .social:hover {
        background: var(--panel-2);
      }

      .social svg {
        width: 18px;
        height: 18px;
      }
    </style>
  </head>

          <a href="skills.html">Skills</a>
          <a href="contact.html">Contact Me</a>
